<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="white"/>
  
  <defs>
    <linearGradient id="techBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
  </defs>
  
  <!-- Modern P Monogram -->
  <g transform="translate(165, 130)">
    <!-- Main Structure -->
    <path d="M 0 0 L 20 0 L 20 252 L 0 252 Z" fill="#000000"/>
    
    <!-- Top Arc with Cut -->
    <path d="M 20 36 L 110 36 Q 182 36, 182 108 Q 182 180, 110 180 L 20 180 Z" 
          fill="#000000"/>
    
    <!-- Inner Circle -->
    <circle cx="110" cy="108" r="48" fill="white"/>
    
    <!-- Blue Gradient Center -->
    <circle cx="110" cy="108" r="28" fill="url(#techBlue)"/>
    
    <!-- White Core Dot -->
    <circle cx="110" cy="108" r="8" fill="white" opacity="0.8"/>
    
    <!-- Tech Accent Bars -->
    <rect x="20" y="200" width="70" height="5" rx="2.5" fill="#2563EB" opacity="0.5"/>
    <rect x="20" y="212" width="50" height="5" rx="2.5" fill="#3B82F6" opacity="0.3"/>
  </g>
  
  <!-- Corner Details -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="3" fill="#2563EB"/>
    <circle cx="432" cy="80" r="3" fill="#2563EB"/>
    <circle cx="80" cy="432" r="3" fill="#2563EB"/>
    <circle cx="432" cy="432" r="3" fill="#2563EB"/>
  </g>
</svg>